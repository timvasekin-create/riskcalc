# ===== Render (один сервис на все домены) =====
# Сервис riskcalc.onrender.com обслуживает:
#   - calc.rustdeck.app → калькулятор (templates/index.html)
#   - rustdeck.app (корень) → главная-хаб (app/index.html) — выбирается по Host-заголовку
#
# DNS в Porkbun:
#   ALIAS (корень, Host пусто)  → riskcalc.onrender.com   → rustdeck.app
#   CNAME  calc                 → riskcalc.onrender.com   → calc.rustdeck.app
# (A-запись НЕ использовать — у Render нет статического IP!)
# Домены добавляются: Render Dashboard → сервис → Settings → Custom Domains.

services:
  - type: web
    name: rustdeck-calc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Токен Telegram-бота задаётся ВРУЧНУЮ в Render Dashboard → Environment
      - key: BOT_TOKEN
        sync: false
