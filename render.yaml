# ===== Render Blueprint =====
# Два сервиса RustDeck на бесплатном плане:
#   1) calc  — калькулятор (main.py + templates/)      → calc.rustdeck.app
#   2) about — промо-лендинг (about/ статика)          → about.rustdeck.app
#
# Как применить: Render Dashboard → New → Blueprint → выбери этот репозиторий.
# Render сам прочитает render.yaml и создаст оба сервиса.
# Домены привязываются в Settings → Custom Domains (CNAME на render через Cloudflare).

services:
  # --- Калькулятор (текущий сайт) ---
  - type: web
    name: rustdeck-calc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- Промо-лендинг (статика, без бэкенда) ---
  - type: web
    name: rustdeck-about
    runtime: static
    plan: free
    staticPublishPath: ./about
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
