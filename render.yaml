# ===== Render (один сервис на все домены) =====
# Сервис riskcalc.onrender.com обслуживает:
#   - rustdeck.app (корень) → главная-хаб (app/index.html)
#   - rustdeck.app/<SEO-страница> → легаси-калькулятор (templates/index.html)
#   - rustdeck.app/admin → админка (только для ADMIN_EMAILS, остальным пустой 404)
#   - api.rustdeck.app → «невидимый» домен: страницы не отдаются (пустой 404),
#     работают только /api/* (интеграции, проверки, UptimeRobot)
#   - localhost / riskcalc.onrender.com → легаси-калькулятор (dev-фолбэк)
# Выбор страницы для "/" — по Host-заголовку в main.py (root() + middleware).
#
# DNS в Porkbun (free-план Render: максимум 2 кастомных домена —
# rustdeck.app + api.rustdeck.app; calc.rustdeck.app выведен):
#   ALIAS (корень, Host пусто)  → riskcalc.onrender.com   → rustdeck.app
#   CNAME  api                  → riskcalc.onrender.com   → api.rustdeck.app
# (A-запись НЕ использовать — у Render нет статического IP!)
# Домены добавляются: Render Dashboard → сервис → Settings → Custom Domains.

services:
  - type: web
    name: rustdeck-calc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Токен Telegram-бота задаётся ВРУЧНУЮ в Render Dashboard → Environment
      - key: BOT_TOKEN
        sync: false
      # Google OAuth: Google Cloud Console → Credentials → OAuth client ID
      # (Authorized redirect URI: https://rustdeck.app/auth/google/callback)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Подпись cookie-сессии (любая длинная случайная строка, напр. openssl rand -hex 32)
      - key: APP_SECRET
        sync: false
      # Админы админки /admin (email через запятую; по умолчанию — владелец)
      - key: ADMIN_EMAILS
        sync: false
